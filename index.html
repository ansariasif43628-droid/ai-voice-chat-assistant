<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>🤖 AI Voice Assistant</h1>

        <div id="status">Click the microphone and speak</div>

        <button id="micButton">🎙️</button>

        <div class="chat-box">
            <p><b>You:</b> <span id="userText">...</span></p>
            <p><b>Assistant:</b> <span id="assistantText">Hello! How can I help you?</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
